<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1410" />
<title>AQA Philosophy · Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --paper: #f4ede1;
    --paper-2: #ebe1cf;
    --gold: #b8893a;
    --burgundy: #6b1f2b;
    --forest: #2d4a3a;
    --shadow: rgba(26, 20, 16, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Fraunces', Georgia, serif;
    background: var(--paper);
    background-image:
      radial-gradient(at 20% 10%, rgba(184, 137, 58, 0.08) 0%, transparent 50%),
      radial-gradient(at 80% 90%, rgba(107, 31, 43, 0.06) 0%, transparent 50%);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(26, 20, 16, 0.012) 2px, rgba(26, 20, 16, 0.012) 3px);
    pointer-events: none;
    z-index: 1;
  }

  header {
    padding: 0.85rem 1.25rem 0.6rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(26, 20, 16, 0.1);
    position: relative;
    z-index: 2;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    font-style: italic;
  }
  .brand span { color: var(--burgundy); }

  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.55;
  }

  .topic-bar {
    display: flex;
    gap: 0.4rem;
    padding: 0.65rem 1.25rem;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid rgba(26, 20, 16, 0.08);
    position: relative;
    z-index: 2;
  }
  .topic-bar::-webkit-scrollbar { display: none; }

  .topic {
    flex-shrink: 0;
    padding: 0.4rem 0.85rem;
    background: transparent;
    border: 1px solid rgba(26, 20, 16, 0.2);
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .topic.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.85rem 1.25rem 0;
    position: relative;
    z-index: 2;
    min-height: 0;
  }

  .card-container {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 3 / 4.3;
    max-height: calc(100dvh - 210px);
    position: relative;
    perspective: 1500px;
  }

  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    padding: 1.4rem 1.3rem 1.1rem;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 1px 2px rgba(26, 20, 16, 0.08),
      0 8px 24px rgba(26, 20, 16, 0.15),
      0 24px 48px rgba(26, 20, 16, 0.12);
    overflow: hidden;
  }

  .card-front {
    background: linear-gradient(140deg, #f9f3e6 0%, #ede2cc 100%);
    border: 1px solid rgba(184, 137, 58, 0.3);
  }

  .card-front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--burgundy) 100%);
  }

  .card-back {
    background: linear-gradient(140deg, #1f1814 0%, #2a1f17 100%);
    color: var(--paper);
    transform: rotateY(180deg);
    border: 1px solid rgba(184, 137, 58, 0.3);
  }

  .card-back::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--burgundy) 0%, var(--gold) 100%);
  }

  .card-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--burgundy);
    margin-bottom: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .card-back .card-tag { color: var(--gold); }

  .card-tag::after {
    content: '';
    flex: 1;
    height: 1px;
    background: currentColor;
    opacity: 0.3;
  }

  .card-question {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.3rem, 4.8vw, 1.7rem);
    line-height: 1.22;
    letter-spacing: -0.01em;
    flex: 1;
    display: flex;
    align-items: center;
    color: var(--ink);
  }

  .card-question em {
    font-style: italic;
    color: var(--burgundy);
  }

  .card-answer {
    flex: 1;
    overflow-y: auto;
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--paper);
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
    -webkit-overflow-scrolling: touch;
  }

  .card-answer::-webkit-scrollbar { width: 4px; }
  .card-answer::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  .card-answer p { margin-bottom: 0.7rem; }
  .card-answer strong {
    color: var(--gold);
    font-weight: 600;
    font-style: italic;
  }
  .card-answer em {
    color: #e8c890;
    font-style: italic;
  }
  .card-answer ul, .card-answer ol { list-style: none; padding-left: 0; }
  .card-answer li {
    padding-left: 1.1rem;
    position: relative;
    margin-bottom: 0.45rem;
  }
  .card-answer li::before {
    content: '◆';
    position: absolute;
    left: 0;
    color: var(--gold);
    font-size: 0.55rem;
    top: 0.4rem;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.85rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgba(26, 20, 16, 0.12);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .card-back .card-footer {
    border-top-color: rgba(244, 237, 225, 0.15);
  }

  .flip-hint {
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .card.swipe-left {
    animation: swipeLeft 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  }
  .card.swipe-right {
    animation: swipeRight 0.35s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  }
  .card.enter {
    animation: cardEnter 0.4s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  }

  @keyframes swipeLeft {
    to { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
  }
  @keyframes swipeRight {
    to { transform: translateX(120%) rotate(8deg); opacity: 0; }
  }
  @keyframes cardEnter {
    from { transform: translateY(20px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .controls {
    padding: 0.85rem 1.25rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    position: relative;
    z-index: 2;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
  }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(26, 20, 16, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--burgundy));
    transition: width 0.3s ease;
    border-radius: 2px;
  }

  .progress-text {
    font-weight: 500;
    opacity: 0.7;
    min-width: 50px;
    text-align: right;
  }

  .nav-row {
    display: flex;
    gap: 0.5rem;
    align-items: stretch;
  }

  .nav-btn {
    flex: 1;
    padding: 0.9rem 0.5rem;
    background: var(--paper);
    border: 1px solid rgba(26, 20, 16, 0.2);
    border-radius: 14px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }

  .nav-btn:active { transform: scale(0.96); }

  .nav-btn.primary {
    flex: 1.6;
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 500;
  }

  .nav-btn svg { width: 14px; height: 14px; }

  .shuffle-btn {
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .shuffle-btn:active { background: rgba(184, 137, 58, 0.15); }
</style>
</head>
<body>

<header>
  <div class="brand">AQA · <span>Philosophy</span></div>
  <div class="meta">Flashcards</div>
</header>

<div class="topic-bar" id="topicBar"></div>

<div class="stage">
  <div class="card-container">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-tag" id="frontTag">CARD</div>
        <div class="card-question" id="question"></div>
        <div class="card-footer">
          <div class="flip-hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
            <span>Tap to reveal</span>
          </div>
          <div id="cardCounter">1 / 1</div>
        </div>
      </div>
      <div class="card-face card-back">
        <div class="card-tag" id="backTag">ANSWER</div>
        <div class="card-answer" id="answer"></div>
        <div class="card-footer">
          <div class="flip-hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
            <span>Tap to flip back</span>
          </div>
          <button class="shuffle-btn" id="shuffleBtn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            Shuffle
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      Prev
    </button>
    <button class="nav-btn primary" id="flipBtn">Flip Card</button>
    <button class="nav-btn" id="nextBtn">
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
